<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavith SMP Status</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-radius:25px;
padding:30px;
width:350px;
box-shadow:0 0 30px #00ffcc;
text-align:center;
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 20px #00ffcc;}
to{box-shadow:0 0 40px #ff00ff;}
}

.status{
font-size:22px;
margin:15px 0;
}

.online{color:#00ff88;}
.offline{color:red;}

.button{
margin-top:15px;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
font-size:16px;
transition:0.3s;
}

.join{
background:linear-gradient(45deg,#00ff88,#00ccff);
color:black;
}

.copy{
background:#222;
color:white;
}

.button:hover{
transform:scale(1.05);
}

.ping-meter{
margin:10px 0;
height:10px;
background:#333;
border-radius:10px;
overflow:hidden;
}

.ping-fill{
height:100%;
background:linear-gradient(90deg,green,yellow,red);
width:0%;
transition:0.5s;
}

.small{
font-size:13px;
opacity:0.7;
}
</style>
</head>

<body>

<div class="card">
<h2>🔥 Lavith SMP 🔥</h2>

<div id="status" class="status">Checking...</div>

<div>Players: <span id="players">0</span></div>
<div>Ping: <span id="ping">0</span> ms</div>

<div class="ping-meter">
<div id="pingFill" class="ping-fill"></div>
</div>

<div class="small">Uptime: <span id="uptime">0s</span></div>

<button class="button join" onclick="joinServer()">JOIN NOW</button>
<button class="button copy" onclick="copyIP()">Copy IP</button>
<button class="button copy" onclick="copyPort()">Copy Port</button>

</div>

<audio id="onlineSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
</audio>

<script>
const ip = "output-pdt.gl.at.ply.gg";
const port = "7855";
let startTime = Date.now();
let wasOnline = false;

async function fetchStatus(){
try{
let res = await fetch(`https://api.mcsrvstat.us/bedrock/2/${ip}:${port}`);
let data = await res.json();

if(data.online){
document.getElementById("status").innerHTML="🟢 Server Online";
document.getElementById("status").className="status online";
document.getElementById("players").innerText=data.players.online + " / " + data.players.max;
document.getElementById("ping").innerText=data.debug.ping || 0;

let pingValue=data.debug.ping || 0;
let percent=Math.min(pingValue,200)/2;
document.getElementById("pingFill").style.width=percent+"%";

if(!wasOnline){
document.getElementById("onlineSound").play();
}
wasOnline=true;

}else{
document.getElementById("status").innerHTML="🔴 Server Offline";
document.getElementById("status").className="status offline";
wasOnline=false;
}

}catch{
document.getElementById("status").innerHTML="Error fetching";
}
}

function joinServer(){
window.location.href=`minecraft://?addExternalServer=LavithSMP|${ip}:${port}`;
}

function copyIP(){
navigator.clipboard.writeText(ip);
alert("IP Copied!");
}

function copyPort(){
navigator.clipboard.writeText(port);
alert("Port Copied!");
}

function updateUptime(){
let seconds=Math.floor((Date.now()-startTime)/1000);
document.getElementById("uptime").innerText=seconds+"s";
}

setInterval(fetchStatus,5000);
setInterval(updateUptime,1000);
fetchStatus();
</script>

</body>
</html>
