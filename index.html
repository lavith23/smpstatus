<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavith SMP Status</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<div class="card">
    <h1>🔥 Lavith SMP 🔥</h1>

    <div id="status" class="status">Checking...</div>

    <div class="stats">
        <div>👥 Players: <span id="players">0</span></div>
        <div>📶 Ping: <span id="ping">0</span> ms</div>
    </div>

    <div class="gauge">
        <div id="gaugeFill" class="gauge-fill"></div>
    </div>

    <div class="uptime">⏱ Uptime: <span id="uptime">0s</span></div>

    <div class="buttons">
        <button onclick="joinServer()" class="join">JOIN NOW</button>
        <button onclick="copyIP()">Copy IP</button>
        <button onclick="copyPort()">Copy Port</button>
    </div>
</div>

<audio id="onlineSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
</audio>

<script src="script.js"></script>
</body>
</html>
