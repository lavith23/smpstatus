<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavith SMP Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🚀 Lavith SMP</h1>

<div id="statusBox" class="status-box loading">
<div id="statusText">Checking Server...</div>
</div>

<div class="info-grid">

<div class="info-card">
<h3>👥 Players</h3>
<p id="players">0 / 0</p>
</div>

<div class="info-card">
<h3>📶 Ping</h3>
<p id="ping">0 ms</p>
</div>

<div class="info-card">
<h3>🧩 Version</h3>
<p id="version">-</p>
</div>

<div class="info-card">
<h3>📜 MOTD</h3>
<p id="motd">-</p>
</div>

</div>

<div class="player-list">
<h3>🧑 Online Players</h3>
<ul id="playerNames">
<li>No players</li>
</ul>
</div>

<button onclick="fetchStatus()" class="refresh">🔄 Refresh</button>

</div>

<script src="script.js"></script>
</body>
</html>
